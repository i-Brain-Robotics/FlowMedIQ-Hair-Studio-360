<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification — FlowGeniQ</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 40%, #16213e 70%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #fff;
        }
        .result-container { width: 100%; max-width: 480px; }
        .result-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(168,85,247,0.2);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .result-icon {
            width: 72px; height: 72px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
        }
        .result-icon.success { background: rgba(16,185,129,0.15); color: #34d399; }
        .result-icon.error { background: rgba(239,68,68,0.15); color: #f87171; }
        h2 { font-size: 22px; font-weight: 700; color: #e2e8f0; margin-bottom: 12px; }
        p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .btn-continue {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            border: none; border-radius: 12px;
            color: #fff; font-size: 15px; font-weight: 700;
            font-family: inherit; cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168,85,247,0.4);
        }
        .brand-footer {
            margin-top: 32px;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <div class="result-card">
            {% if success %}
            <div class="result-icon success">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <h2>Email Verified!</h2>
            <p>{{ message }}</p>
            {% if redirect_url %}
            <a href="{{ redirect_url }}" class="btn-continue">
                Continue
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </a>
            {% endif %}
            {% else %}
            <div class="result-icon error">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            </div>
            <h2>Verification Failed</h2>
            <p>{{ message }}</p>
            <a href="/demo/t/{{ slug }}/" class="btn-continue">
                Try Again
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"/>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                </svg>
            </a>
            {% endif %}

            <div class="brand-footer">FlowGeniQ — Powered by FlowMediQ AI</div>
        </div>
    </div>

    {% if success and redirect_url %}
    <script>
        // Auto-redirect after 3 seconds
        setTimeout(function() {
            window.location.href = '{{ redirect_url }}';
        }, 3000);
    </script>
    {% endif %}
</body>
</html>
